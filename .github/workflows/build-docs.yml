name: Build and Deploy Docs

on:
  push:
    branches:
      - 'main'
    paths:
      - 'docs/**'
      - 'src/**'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow pushing to gh-pages
permissions:
  contents: write

jobs:
  build:
    name: 'Build and Deploy Sphinx Docs'
    runs-on: ubuntu-latest

    # Allow one concurrent deployment
    concurrency:
      group: "pages"
      cancel-in-progress: true

    if: github.actor != 'pdsen-ci'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.ADMIN_GITHUB_TOKEN || github.token }}

      - name: Set up Python 3
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          # Install Sphinx
          pip install -r docs/requirements.txt

      - name: Build Sphinx documentation
        run: |
          cd docs
          # Make the HTML docs and copy to main
          make github
          cd ..

      - name: Deploy to gh-pages branch
        run: |
          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Fetch gh-pages branch if it exists
          git fetch origin gh-pages:gh-pages || echo "gh-pages branch does not exist yet"

          # Checkout gh-pages branch (create if it doesn't exist)
          git checkout gh-pages 2>/dev/null || git checkout --orphan gh-pages

          # Remove old content but keep .git directory
          git rm -rf . || true

          # Add all files (the built site is now in the root from make github)
          git add .

          # Commit and push to gh-pages (preserving history)
          git commit -m "Deploy documentation from commit ${{ github.sha }}" || echo "No changes to commit"
          git push origin gh-pages
